# Takeoff Pad Marker Map
# 15cm marker placed directly under the camera at the drone's starting position,
# enabling vision lock BEFORE takeoff (GUIDED arming on the ground).
#
# The marker's physical size must match config/aruco_detector.yaml. If it differs
# from the global marker_size, declare it with marker_size_ids / marker_size_values;
# otherwise altitude is wrong by size_assumed / size_real.

markers:
  - id: 0
    position:
      x: 0.0  # Takeoff position X (meters)
      y: 0.0  # Takeoff position Y (meters)
      z: 0.0  # Ground level
    description: "15cm takeoff marker - place under camera at start position"

# Usage:
# 1. Place the 15cm ArUco marker (ID 0) on the ground under the camera
# 2. Marker defines the origin (0, 0, 0) of the world coordinate frame
# 3. Marker's red axis should point in your "forward" direction (X+)
# 4. Vision position is valid before arming; takeoff can start in GUIDED
