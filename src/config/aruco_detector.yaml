# ArUco Detector Configuration

aruco_detector:
  ros__parameters:
    # Camera topics
    camera_topic: '/camera/image_raw'
    camera_info_topic: '/camera/camera_info'

    # ArUco marker parameters
    marker_size: 0.15  # Default size of ArUco markers in meters (measure outer black border)
    aruco_dict_type: 'DICT_4X4_50'  # ArUco dictionary type

    # Per-ID marker size overrides (parallel arrays: ids[i] has size values[i] meters).
    # Pose distance scales linearly with the assumed size, so small takeoff-pad
    # markers MUST declare their true size here or altitude reads ~5x too far.
    # IDs not listed fall back to marker_size above (the 15cm flight grid).
    marker_size_ids: [0, 1]
    marker_size_values: [0.03, 0.02]   # ID 0 = 3cm takeoff pad, ID 1 = 2cm test marker

    # Distance calibration correction
    # If ArUco reports wrong distance, adjust this factor
    # Formula: corrected_distance = measured_distance * distance_scale_factor
    # Example: If ArUco reports 1.33m when real is 0.5m, use 0.5/1.33 = 0.376
    # Calibrated for the current Logitech C270 test setup.
    distance_scale_factor: 0.632

    # Visualization
    visualize: true

    # Publishing rate
    publish_rate: 30.0
