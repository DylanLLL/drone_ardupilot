# ArUco Detector Configuration

aruco_detector:
  ros__parameters:
    # Camera topics
    camera_topic: '/camera/image_raw'
    camera_info_topic: '/camera/camera_info'

    # ArUco marker parameters
    marker_size: 0.15  # Default size of ArUco markers in meters (measure outer black border)
    aruco_dict_type: 'DICT_4X4_50'  # ArUco dictionary type

    # Per-ID marker size overrides (parallel arrays: ids[i] has size values[i] meters).
    # Pose distance scales linearly with the assumed size, so mixed-size setups MUST
    # declare each marker's true size here or distance/altitude reads proportionally wrong.
    # IDs not listed fall back to marker_size above.
    # Currently flying a single 15cm marker (ID 0) -> no overrides needed.
    # The [-1] / [0.0] entries are placeholders meaning "no overrides".
    marker_size_ids: [-1]
    marker_size_values: [0.0]

    # Distance calibration correction
    # Formula: corrected_distance = measured_distance * distance_scale_factor
    # Reset to 1.0 for the correctly-sized 15cm marker. The previous 0.632 was a 37%
    # correction — too large to be a lens effect; it was compensating for a wrong
    # assumed marker size. With a properly calibrated camera + correct size this should
    # sit near 1.0. VERIFY on the bench (Test 1): hold at a measured distance and check
    # the logged CORRECTED distance matches; if off by a constant ratio, set this to
    # (real_distance / reported_distance).
    distance_scale_factor: 1.0

    # Visualization
    visualize: true

    # Publishing rate
    publish_rate: 30.0
